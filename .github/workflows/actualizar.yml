name: Actualizar índices unificados

on:
  schedule:
    - cron: "0 14 * * *"   # todos los días, 9:00 a. m. hora de Lima
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano
    inputs:
      completar_pdfs:
        description: "Completar los PDF (R.J. firmada y extracto El Peruano) de meses anteriores"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - name: Buscar mes nuevo en el INEI
        id: iu
        env:
          IU_BASE: ${{ github.workspace }}/descargas
        run: |
          out=$(python3 scripts/update_iu.py)
          if [ "${{ inputs.completar_pdfs }}" = "true" ]; then
            out="$out"$'\n'"$(python3 scripts/update_iu.py --backfill)"
          fi
          echo "$out"
          if echo "$out" | grep -q '^NUEVO'; then echo "cambios=si" >> "$GITHUB_OUTPUT"; fi
          echo "resumen=$(echo "$out" | grep '^NUEVO' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Regenerar la página
        if: steps.iu.outputs.cambios == 'si'
        env:
          IU_BASE: ${{ github.workspace }}/descargas
        run: python3 scripts/build_site.py --out .
      - name: Guardar cambios
        if: steps.iu.outputs.cambios == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Actualiza índices unificados: ${{ steps.iu.outputs.resumen }}"
          git push
